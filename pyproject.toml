[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpu-benchlab"
version = "0.1.0"
description = "Open-source framework for measuring and comparing AI inference performance across NVIDIA acceleration stacks."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["gpu", "benchmark", "inference", "nvidia", "cuda", "tensorrt", "onnxruntime", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Benchmark",
]

# Core dependencies are deliberately CPU-installable and lightweight.
# Every GPU/runtime dependency is an optional extra so that:
#   1. the framework, CLI, schema and test-suite install anywhere (incl. CI runners with no GPU),
#   2. a machine without an NVIDIA GPU can still exercise the detection and "unsupported" paths.
# `nvidia-ml-py` is a pure-python ctypes wrapper: it installs without a GPU and fails
# at nvmlInit() time, which is exactly the behaviour the detection layer is built to report.
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "psutil>=5.9",
    "nvidia-ml-py>=12.535",
]

[project.optional-dependencies]
# --- Inference backends (installed per-machine; see docs/environment.md) -------------
# PyTorch is intentionally NOT pinned to a CUDA build here. The correct wheel depends on
# the target machine's driver. See docs/environment.md for the per-CUDA index URLs.
torch = ["torch>=2.4", "torchvision>=0.19"]
onnx = ["onnx>=1.16", "onnxruntime-gpu>=1.18"]
onnx-cpu = ["onnx>=1.16", "onnxruntime>=1.18"]
tensorrt = ["tensorrt>=10.0"]

# --- Development ---------------------------------------------------------------------
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
gpu-bench = "gpu_benchlab.cli.main:app"

[project.urls]
Homepage = "https://github.com/your-org/gpu-inference-benchmarking-lab"
Documentation = "https://github.com/your-org/gpu-inference-benchmarking-lab/tree/main/docs"
Issues = "https://github.com/your-org/gpu-inference-benchmarking-lab/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gpu_benchlab"]

# ---------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ANN", "BLE", "S"]
ignore = [
    "ANN401",  # Any is legitimate at the NVML/ctypes and JSON boundaries.
    "B008",    # typer uses function calls (typer.Option) in argument defaults by design.
]

[tool.ruff.lint.per-file-ignores]
# Tests use bare asserts (S101) and do not need full annotations.
"tests/**" = ["ANN", "S101"]
# Backend.load/build/validate/synchronize/close are deliberately optional hooks
# with no-op defaults: not every runtime has an engine build or needs a device
# synchronization. Making them abstract would force every backend to write five
# empty methods, so B027 is opted out of here by design (see ADR 0004).
"src/gpu_benchlab/core/backend.py" = ["B027"]
# The fake backend asserts on config type to keep the contract honest, and uses
# `random` deliberately: reproducibility is the requirement, not unpredictability.
# A seeded Mersenne Twister is exactly right here and is never security-relevant.
"src/gpu_benchlab/backends/fake.py" = ["S101", "S311"]
# S607: "git" is resolved from PATH on purpose -- a developer tool must use the
# developer's git. The argv is a fixed list with shell=False and no user input.
"src/gpu_benchlab/core/provenance.py" = ["S607"]

[tool.mypy]
# Type-checked at 3.12, not 3.10: numpy's shipped stubs use PEP 695 `type`
# statements that mypy cannot parse under an older target. Runtime support for
# 3.10 is verified the way it should be -- by running the real test suite on
# 3.10 in CI -- and ruff (target-version = py310) still rejects syntax that
# 3.10 could not execute.
python_version = "3.12"
packages = ["gpu_benchlab"]
mypy_path = "src"
strict = true
warn_unreachable = true
# Optional GPU runtimes are absent on CPU-only dev machines and CI.
[[tool.mypy.overrides]]
module = ["pynvml.*", "torch.*", "torchvision.*", "onnxruntime.*", "tensorrt.*", "tensorrt_llm.*", "psutil.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gpu: requires a physically present, driver-visible NVIDIA GPU",
    "torch: requires PyTorch to be installed",
    "onnx: requires ONNX Runtime to be installed",
    "tensorrt: requires TensorRT to be installed",
    "slow: takes more than a few seconds",
]
