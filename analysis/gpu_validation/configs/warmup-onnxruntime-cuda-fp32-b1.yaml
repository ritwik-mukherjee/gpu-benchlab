# Phase 5A runbook §6 warmup trajectory (ONNX Runtime, needed for §11) (docs/runbooks/gpu-validation.md). NOT YET RUN on NVIDIA hardware.
# On a machine without CUDA this ends status: unavailable -- never a CPU run.
name: p5a-warmup-onnxruntime-cuda-fp32-b1
backend: onnxruntime
device: cuda:0
precision: fp32
batch_size: 1
model:
  name: resnet50
  weights: IMAGENET1K_V2
backend_options:
  use_io_binding: true
  cudnn_conv_algo_search: EXHAUSTIVE
  allow_export: false
benchmark:
  warmup_iterations: 300
  measurement_iterations: 1000
